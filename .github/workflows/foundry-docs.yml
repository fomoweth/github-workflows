name: Foundry Documentation

on:
  workflow_call:
    inputs:
      foundry-version:
        description: Foundry version to install.
        type: string
        default: v1.7.1

permissions: {}

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ inputs.foundry-version }}

      - name: Show Forge Version
        run: forge --version

      - name: Configure Documentation
        shell: bash
        run: |
          if [[ ! -f book.toml ]]; then
            cat > book.toml <<EOF
          [output.html]
          site-url = "/${{ github.event.repository.name }}/"
          EOF
          fi

      - name: Run Forge Doc
        run: forge doc --build

      - name: Verify Documentation Output
        run: |
          test -f docs/book.toml
          test -f docs/book/index.html
          test -f docs/book/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/book

  deploy:
    name: Deploy Documentation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
