name: RPC Environment

on:
  pull_request:
    paths:
      - ".github/workflows/rpc-env.yml"
      - "actions/rpc-env/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rpc-env.yml"
      - "actions/rpc-env/**"

permissions:
  contents: read

jobs:
  test:
    name: Test RPC Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure RPC Environment
        uses: ./actions/rpc-env
        with:
          alchemy-api-key: alchemy-key
          infura-api-key: infura-key

      - name: Verify RPC Environment
        shell: bash
        run: |
          test "$RPC_MAINNET" = "https://eth-mainnet.g.alchemy.com/v2/alchemy-key"
          test "$RPC_HEMI" = "https://hemi-mainnet.infura.io/v3/infura-key"
