name: Set up Foundry environment

description: Installs Foundry and exposes the installed version.

inputs:
  version:
    description: Foundry version to install.
    required: false
    default: stable

outputs:
  version:
    description: Installed Foundry version.
    value: ${{ steps.version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: ${{ inputs.version }}

    - name: Determine Foundry version
      id: version
      shell: bash
      run: |
        version="$(forge --version | head -n 1)"
        echo "version=$version" >> "$GITHUB_OUTPUT"
